[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phanet-core"
version = "0.1.0a1"
description = "Phage genome annotation, protein function prediction and module analysis"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "biopython>=1.83,<2",
  "torch>=2.1,<3",
]

[project.scripts]
phanet = "phanet.cli:main"

[project.optional-dependencies]
esm = ["fair-esm==2.0.0"]
network = ["pyhmmer==0.11.0", "transformers==4.38.2", "sentencepiece==0.2.0"]
faiss = ["faiss-cpu>=1.8,<2"]
test = ["pytest>=8,<9"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.setuptools.package-data]
"phanet.analysis" = ["policies/*.json"]
